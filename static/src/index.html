<!doctype html>
<html class="no-js" lang="en">
<head>
  <meta charset="utf-8">
  <title><%= title %></title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script defer src="{{relative_to_root}}/_mpw_static/mathjax/tex-chtml.js"></script>
  <!--
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  -->
  <!-- Place favicon.ico and apple-touch-icon.png in the root directory -->

</head>
<body>

<div class="container-fluid">
  <div class="row mt-3">
    <div class="col">
      <div class="card">
        <div class="card-body pb-1">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <%= breadcrumb %>
            </ol>
        </nav>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-md-2">
      <div class="card">
        <h5 class="card-header bg-primary text-light border-primary rounded-top">
          <a href="gitwiki://abc1-def2-ghi3//math.md">Edit</a>
        </h5>
        <div class="card-body bg-light text-dark">
         <%= sidebar %>
        </div>
      </div>
    </div>
    <div class="col-md-7">
      <div class="card">
        <h5 class="card-header bg-primary text-light border-primary rounded-top"><%= title %></h5>
        <div class="card-body bg-light text-dark">
         <%= content %>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card">
        <h5 class="card-header bg-primary text-light border-primary">
         Table of content
        </h5>
        <div>
          <%= table_of_content %>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
